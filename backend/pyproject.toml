[project]
name = "checkboxes"
version = "0.1.0"
description = "Detect checkboxes in appraisal form images and classify them as checked / unchecked"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=12.3.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pypdfium2>=5.13.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclass, safe as a default argument.
extend-immutable-calls = ["checkboxes.detector.DetectorParams"]
